<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cart - Dough‑Re‑Me</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .navbar {
      background: rgba(255,255,255,0.95);
      padding: 15px 30px;
      border-radius: 15px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .navbar h1 {
      color: #667eea;
      font-size: 28px;
      font-weight: 700;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      color: #333;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      transition: all 0.3s;
      font-weight: 500;
    }
    .nav-links a:hover {
      background: #667eea;
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .page-header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }
    .page-header h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .page-header p {
      font-size: 18px;
      opacity: 0.9;
    }
    .cart-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
      align-items: start;
    }
    .cart-items {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }
    .cart-items h2 {
      font-size: 28px;
      color: #2d3748;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cart-item {
      display: flex;
      gap: 20px;
      padding: 20px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      margin-bottom: 15px;
      transition: all 0.3s;
    }
    .cart-item:hover {
      border-color: #667eea;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
    }
    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
    }
    .item-details {
      flex: 1;
    }
    .item-name {
      font-size: 20px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 5px;
    }
    .item-category {
      display: inline-block;
      background: #f7fafc;
      color: #4a5568;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .item-price {
      font-size: 24px;
      color: #667eea;
      font-weight: 700;
    }
    .item-actions {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: flex-end;
    }
    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f7fafc;
      padding: 5px;
      border-radius: 8px;
    }
    .qty-btn {
      background: #667eea;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
    }
    .qty-btn:hover {
      background: #5568d3;
    }
    .qty-display {
      min-width: 40px;
      text-align: center;
      font-weight: 700;
      color: #2d3748;
    }
    .remove-btn {
      background: #fc8181;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .remove-btn:hover {
      background: #f56565;
    }
    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }
    .empty-cart-icon {
      font-size: 80px;
      margin-bottom: 20px;
    }
    .empty-cart h3 {
      font-size: 24px;
      margin-bottom: 10px;
    }
    .empty-cart a {
      display: inline-block;
      margin-top: 20px;
      background: #667eea;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .empty-cart a:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    .checkout-section {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      position: sticky;
      top: 20px;
    }
    .checkout-section h2 {
      font-size: 24px;
      color: #2d3748;
      margin-bottom: 20px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      color: #4a5568;
      font-size: 16px;
    }
    .summary-row.total {
      border-top: 2px solid #e2e8f0;
      margin-top: 10px;
      padding-top: 20px;
      font-size: 24px;
      font-weight: 700;
      color: #2d3748;
    }
    .checkout-form {
      margin-top: 25px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .checkout-btn {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .checkout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
    }
    .checkout-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .success-message {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #48bb78;
      color: white;
      padding: 16px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      font-weight: 600;
      animation: slideIn 0.3s ease-out;
      z-index: 1000;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @media (max-width: 968px) {
      .cart-grid {
        grid-template-columns: 1fr;
      }
      .checkout-section {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1>🥖 Dough-Re-Me</h1>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/cart.html">🛒 Cart</a>
      <a href="/orders.html">📦 Orders</a>
    </div>
  </div>
  <div class="container">
    <div class="page-header">
      <h1>🛒 Your Cart</h1>
      <p>Review your items and proceed to checkout</p>
    </div>
    <div class="cart-grid">
      <div class="cart-items">
        <h2>🛍️ Cart Items</h2>
        <div id="cart"></div>
      </div>
      <div class="checkout-section">
        <h2>💳 Checkout</h2>
        <div id="summary"></div>
        <form id="checkoutForm" class="checkout-form">
          <div class="form-group">
            <label>👤 Full Name</label>
            <input name="name" required placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label>📧 Email Address</label>
            <input name="email" type="email" required placeholder="your@email.com">
          </div>
          <div class="form-group">
            <label>📱 Phone Number</label>
            <input name="phone" required placeholder="1234567890">
          </div>
          <button type="submit" class="checkout-btn" id="placeOrderBtn">
            Place Order
          </button>
        </form>
      </div>
    </div>
  </div>
  <script>
    const cartKey = 'drm_cart_v1';
    
    function showSuccessMessage(message) {
      const msg = document.createElement('div');
      msg.className = 'success-message';
      msg.textContent = message;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 3000);
    }
    
    function loadCart(){
      const raw = localStorage.getItem(cartKey) || '[]';
      return JSON.parse(raw);
    }
    
    function saveCart(cart) {
      localStorage.setItem(cartKey, JSON.stringify(cart));
    }
    
    function updateQuantity(itemId, delta) {
      const cart = loadCart();
      const item = cart.find(i => i.id === itemId);
      if (item) {
        item.quantity += delta;
        if (item.quantity <= 0) {
          removeItem(itemId);
        } else {
          saveCart(cart);
          render();
        }
      }
    }
    
    function removeItem(itemId) {
      const cart = loadCart();
      const filtered = cart.filter(i => i.id !== itemId);
      saveCart(filtered);
      showSuccessMessage('Item removed from cart');
      render();
    }
    
    function calculateTotal() {
      const cart = loadCart();
      return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    }
    
    function render(){
      const cart = loadCart();
      const cartEl = document.getElementById('cart');
      const summaryEl = document.getElementById('summary');
      
      if(cart.length === 0){ 
        cartEl.innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">🛒</div>
            <h3>Your cart is empty</h3>
            <p>Add some delicious desserts to get started!</p>
            <a href="/">Browse Products</a>
          </div>
        `;
        summaryEl.innerHTML = '';
        document.getElementById('checkoutForm').style.display = 'none';
        return;
      }
      
      document.getElementById('checkoutForm').style.display = 'block';
      
      cartEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <img src="${item.img || '/static/images/shop.png'}" alt="${item.name}">
          <div class="item-details">
            <div class="item-name">${item.name}</div>
            <span class="item-category">${item.category || 'Dessert'}</span>
            <div class="item-price">₹${item.price} × ${item.quantity} = ₹${item.price * item.quantity}</div>
          </div>
          <div class="item-actions">
            <div class="quantity-controls">
              <button class="qty-btn" onclick="updateQuantity(${item.id}, -1)">−</button>
              <span class="qty-display">${item.quantity}</span>
              <button class="qty-btn" onclick="updateQuantity(${item.id}, 1)">+</button>
            </div>
            <button class="remove-btn" onclick="removeItem(${item.id})">🗑️ Remove</button>
          </div>
        </div>
      `).join('');
      
      const subtotal = calculateTotal();
      const tax = Math.round(subtotal * 0.05);
      const total = subtotal + tax;
      
      summaryEl.innerHTML = `
        <div class="summary-row">
          <span>Subtotal (${cart.length} items)</span>
          <span>₹${subtotal}</span>
        </div>
        <div class="summary-row">
          <span>Tax (5%)</span>
          <span>₹${tax}</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span>₹${total}</span>
        </div>
      `;
    }
    
    document.getElementById('checkoutForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('placeOrderBtn');
      btn.disabled = true;
      btn.textContent = 'Processing...';
      
      const form = new FormData(e.target);
      const cart = loadCart();
      
      if(cart.length === 0){ 
        showSuccessMessage('Cart is empty!');
        btn.disabled = false;
        btn.textContent = 'Place Order';
        return;
      }
      
      const payload = {
        customer_name: form.get('name'),
        customer_email: form.get('email'),
        customer_phone: form.get('phone'),
        items: cart.map(i => ({product_id: i.id, quantity: i.quantity}))
      };
      
      try {
        const res = await fetch('/api/v1/orders/', {
          method: 'POST',
          headers: {'content-type': 'application/json'},
          body: JSON.stringify(payload)
        });
        
        if(res.ok) {
          const order = await res.json();
          showSuccessMessage('Order placed successfully! 🎉');
          localStorage.removeItem(cartKey);
          setTimeout(() => {
            window.location.href = '/orders.html?order=' + order.id;
          }, 2000);
        } else {
          const txt = await res.text();
          alert('Error placing order: ' + txt);
          btn.disabled = false;
          btn.textContent = 'Place Order';
        }
      } catch (error) {
        alert('Network error: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Place Order';
      }
    });
    
    // Make functions available globally
    window.updateQuantity = updateQuantity;
    window.removeItem = removeItem;
    
    render();
  </script>
</body>
</html>
