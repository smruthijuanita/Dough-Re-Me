<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mango Cheesecake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="container header">
      <a class="brand" href="/index.html">Dough-Re-Me</a>
      <a class="cart" href="/cart.html">🧺 <span id="cartBadge" class="badge">0</span></a>
    </header>
    <main class="container">
      <div class="product-wrap">
        <div class="product-card">
          <div class="product-img"><img id="prodImg" src="/static/images/mango_cheesecake.jpeg" alt="Mango Cheesecake"></div>
          <h1 class="h1" id="prodName">Mango Cheesecake</h1>
          <div class="price" id="prodPrice">₹80</div>
          <div class="meta" id="prodMeta">Cheesecake • Tropical • ★ 4.8</div>

          <div class="field">
            <label for="size">Size</label>
            <select id="size">
              <option value="slice">Slice</option>
              <option value="6">6" whole</option>
              <option value="8">8" whole</option>
            </select>
          </div>
          <div class="field">
            <label for="qty">Quantity</label>
            <input id="qty" type="number" min="1" value="1" />
          </div>
          <div class="field">
            <label for="note">Notes</label>
            <textarea id="note"></textarea>
          </div>
          <button class="btn primary add-to-cart-btn" id="addBtn">Add to cart</button>
        </div>
        <aside>
          <div class="product-card"><h3>Info</h3><p>Best when chilled; contains dairy.</p></div>
        </aside>
      </div>
    </main>
    <script src="/static/cart.js"></script>
    <script>
      const product = { id: 'p4', name: 'Mango Cheesecake', price: 80 };
      document.getElementById('addBtn').addEventListener('click', () => {
        const qty = Math.max(1, parseInt(document.getElementById('qty').value) || 1);
        const size = document.getElementById('size').value;
        addItemToCart({ id: product.id, name: product.name, price: product.price, quantity: qty, options: { size } });
      });
    </script>
  </body>
</html>
